# H2 内存数据库测试模式 (专为未安装 MySQL 的项目组成员提供)
spring.datasource.url=jdbc:h2:mem:web;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR,MONTH,DAY;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
mybatis.mapper-locations=classpath:mapping/online/*.xml
mybatis.type-aliases-package=com.tongji.enso.mybatisdemo.entity.online
server.port=8888
