# Database config (production defaults)
spring.datasource.url=jdbc:mysql://202.120.171.182:3306/web?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=chenyuxuan0909
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

mybatis.mapper-locations=classpath:mapping/online/*.xml
mybatis.type-aliases-package=com.tongji.enso.mybatisdemo.entity.online

server.port=8888
admin.auth.enabled=true
admin.upload.root=uploads
admin.upload.public-prefix=/admin-files

# Admin API security config
admin.jwt.secret=${ADMIN_JWT_SECRET:}
admin.jwt.expire-seconds=${ADMIN_JWT_EXPIRE_SECONDS:7200}
admin.import.max-records=${ADMIN_IMPORT_MAX_RECORDS:500}
admin.import.max-file-size-bytes=${ADMIN_IMPORT_MAX_FILE_SIZE_BYTES:10485760}

# Admin bootstrap account
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:admin}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:12345678}
admin.auth.token-ttl-seconds=${ADMIN_TOKEN_TTL_SECONDS:28800}

# ECMWF fetch script config
admin.ecmwf.python=${ECMWF_PYTHON:python3}
admin.ecmwf.script=${ECMWF_SCRIPT_PATH:scripts/ecmwf_fetch.py}
admin.ecmwf.timeout-seconds=${ECMWF_TIMEOUT_SECONDS:240}

# File upload limits
spring.servlet.multipart.max-file-size=${ADMIN_IMPORT_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${ADMIN_IMPORT_MAX_REQUEST_SIZE:500MB}

# ECMWF raw-data plotter config
ecmwf.open-data-root=https://data.ecmwf.int/forecasts
ecmwf.api-key=${ECMWF_API_KEY:}
ecmwf.api-email=${ECMWF_API_EMAIL:}
ecmwf.download-timeout-ms=120000
ecmwf.plotter-command=${ECMWF_PLOTTER_COMMAND:python}
ecmwf.plotter-script=${ECMWF_PLOTTER_SCRIPT:scripts/ecmwf_plot.py}

