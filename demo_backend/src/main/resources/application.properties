
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/web?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

mybatis.mapper-locations=classpath:mapping/online/*.xml
mybatis.type-aliases-package=com.tongji.enso.mybatisdemo.entity.online

server.port=8888
#server.ssl.key-store=classpath:tjensoprediction.com.jks
#server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
#server.ssl.key-store-type=JKS
#server.ssl.enabled=true

# Admin API security. Production startup fails when ADMIN_JWT_SECRET is missing.
# Use at least 32 random characters; never commit a real secret.
admin.jwt.secret=${ADMIN_JWT_SECRET:}
admin.jwt.expire-seconds=${ADMIN_JWT_EXPIRE_SECONDS:7200}
admin.import.max-records=${ADMIN_IMPORT_MAX_RECORDS:500}
admin.import.max-file-size-bytes=${ADMIN_IMPORT_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${ADMIN_IMPORT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ADMIN_IMPORT_MAX_FILE_SIZE:10MB}
