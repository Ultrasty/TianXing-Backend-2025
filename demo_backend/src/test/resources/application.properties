spring.datasource.url=jdbc:h2:mem:tianxing_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR,MONTH,DAY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
springfox.documentation.enabled=false
mybatis.mapper-locations=classpath:mapping/online/*.xml
mybatis.type-aliases-package=com.tongji.enso.mybatisdemo.entity.online
admin.jwt.secret=test-only-random-looking-secret-32-bytes-minimum
admin.jwt.expire-seconds=7200
admin.import.max-records=5
admin.import.max-file-size-bytes=4096
